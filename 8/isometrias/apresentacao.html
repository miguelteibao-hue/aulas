    },
    aux(o, g) {
      svgEl('line', { x1: SX(o.de), y1: SY(o.de), x2: SX(o.ate), y2: SY(o.ate), class: 'g-aux' + (o.cor ? ' ' + corCls(o.cor) : '') }, g);
      return [];
    },
    reto(o, g) {
      const p = P(o.p), a = P(o.a), b = P(o.b), s = o.s || 0.32;
      const n = (q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1; return [dx / l * s, dy / l * s]; };
      const da = n(a), db = n(b);
      const pts = [[p[0] + da[0], p[1] + da[1]], [p[0] + da[0] + db[0], p[1] + da[1] + db[1]], [p[0] + db[0], p[1] + db[1]]];
      svgEl('path', { d: 'M' + X(pts[0][0]) + ',' + Y(pts[0][1]) + ' L' + X(pts[1][0]) + ',' + Y(pts[1][1]) + ' L' + X(pts[2][0]) + ',' + Y(pts[2][1]), class: 'g-reto' }, g);
      return [];
    },
    arco(o, g) {
      const c = P(o.c), r = o.r * u, a0 = o.a0 * Math.PI / 180, a1 = o.a1 * Math.PI / 180;
      const cx = X(c[0]), cy = Y(c[1]);
      const p0 = [cx + r * Math.cos(a0), cy - r * Math.sin(a0)], p1 = [cx + r * Math.cos(a1), cy - r * Math.sin(a1)];
      const grande = Math.abs(o.a1 - o.a0) > 180 ? 1 : 0, varre = o.a1 > o.a0 ? 0 : 1;
      const cls = corCls(o.cor || 'laranja');
      svgEl('path', { d: 'M' + p0[0] + ',' + p0[1] + ' A' + r + ',' + r + ' 0 ' + grande + ' ' + varre + ' ' + p1[0] + ',' + p1[1], class: 'g-arco ' + cls }, g);
      if (o.seta !== false) {
        const s = o.a1 > o.a0 ? 1 : -1;          /* tangente no fim, no sentido do arco */
        const tx = -Math.sin(a1) * s, ty = -Math.cos(a1) * s;
        const cab = 17, lc = 8, bx = p1[0] - tx * cab, by = p1[1] - ty * cab;
        svgEl('path', { class: 'g-ponta ' + cls, d: 'M' + p1[0] + ',' + p1[1] + ' L' + (bx - ty * lc) + ',' + (by + tx * lc) + ' L' + (bx + ty * lc) + ',' + (by - tx * lc) + ' Z' }, g);
      }
      if (!o.m) return [];
      const am = ((o.am != null ? o.am : (o.a0 + o.a1) / 2)) * Math.PI / 180, rm = (o.rm || o.r + 0.62) * u;
      return [rot(cx + rm * Math.cos(am), cy - rm * Math.sin(am), o.m, 'center', cls, o.tam || 30)];
    },
    circ(o, g) {
      svgEl('circle', { cx: SX(o.c), cy: SY(o.c), r: o.r * u, class: 'g-pol ' + (o.est || 'orig') + (o.tr ? ' tr' : '') }, g);
      return [];
    },
    rot(o) { return [rot(SX(o.p), SY(o.p), o.m, o.pos || 'center', o.cor ? corCls(o.cor) : '', o.tam, o.dist)]; },
  };

  function desenhar() {
    svg.innerHTML = ''; camada.innerHTML = '';
    G = {}; L = {};
    if (def.grelha) {
      const [gx0, gy0, gx1, gy1] = def.grelha;
      const g = svgEl('g', { class: 'g-grelha' }, svg);
      svgEl('rect', { x: X(gx0), y: Y(gy1), width: (gx1 - gx0) * u, height: (gy1 - gy0) * u, class: 'g-papel' }, g);
      let d = '';
      for (let x = Math.ceil(gx0); x <= gx1 + 1e-9; x++) d += 'M' + X(x) + ',' + Y(gy0) + 'V' + Y(gy1);
      for (let y = Math.ceil(gy0); y <= gy1 + 1e-9; y++) d += 'M' + X(gx0) + ',' + Y(y) + 'H' + X(gx1);
      svgEl('path', { d, class: 'g-linhas' }, g);
    }
    if (def.fundo) def.fundo(svg, { X, Y, P, u, svgEl, rot });
    let corte = null;
    if (def.recorte) {
      const [rx0, ry0, rx1, ry1] = def.recorte, idc = 'rc' + (++Geo.n);
      const cp = svgEl('clipPath', { id: idc }, svgEl('defs', {}, svg));
      svgEl('rect', { x: X(rx0), y: Y(ry1), width: (rx1 - rx0) * u, height: (ry1 - ry0) * u }, cp);
      corte = 'url(#' + idc + ')';
    }
    for (const id of ids) {
      const o = objs[id];
      if (!est[id].vis) continue;
      const pai = o.recorte && corte ? svgEl('g', { 'clip-path': corte }, svg) : svg;
      const g = svgEl('g', { class: 'go' + (est[id].aceso ? ' aceso' : ''), 'data-id': id }, pai);
      G[id] = g;
      L[id] = DESENHO[o.t](o, g, id) || [];
      if (est[id].aceso && o.t !== 'vet' && o.t !== 'pol' && o.t !== 'pto') L[id].forEach((d) => d.classList.add('aceso'));
    }
  }

  /* ---------------- animações ---------------- */
  const dash = (e, dur, at, ease) => {
    const len = e.getTotalLength ? e.getTotalLength() : 300;
    e.animate([{ strokeDasharray: len + ' ' + len, strokeDashoffset: len }, { strokeDasharray: len + ' ' + len, strokeDashoffset: 0 }],
      { duration: T(dur), delay: T(at), easing: ease || 'cubic-bezier(.4,0,.3,1)', fill: 'backwards' });
  };
  const aparecer = (e, dur, at) => e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(dur || 380), delay: T(at || 0), easing: 'ease-out', fill: 'backwards' });
  const rotsDepois = (id, at) => (L[id] || []).forEach((d) => I.entrarRot(d, at));
  function animMostra(id, at) {
    const o = objs[id], g = G[id];
    if (!g) return;
    if (o.t === 'vet') {
      dash(g.querySelector('line'), 560, at);
      g.querySelector('.g-ponta').animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(140), delay: T(at + 470), fill: 'backwards' });
      rotsDepois(id, at + 380);
    } else if (o.t === 'eixo' || o.t === 'aux' || o.t === 'lin') {
      g.querySelectorAll('line, path').forEach((e) => { if (o.tr || o.t === 'aux' || (o.t === 'lin' && o.tr)) aparecer(e, 450, at); else dash(e, 620, at); });
      rotsDepois(id, at + 450);
    } else if (o.t === 'pol' || o.t === 'circ') {
      const p = g.querySelector('path, circle');
      if (o.tr || o.est === 'inter') aparecer(p, 500, at);
      else {
        dash(p, 750, at);
        p.animate([{ fillOpacity: 0 }, { fillOpacity: 0, offset: 0.6 }, { fillOpacity: 1 }], { duration: T(1000), delay: T(at), fill: 'backwards' });
      }
      rotsDepois(id, at + 650);
    } else if (o.t === 'pto') {
      const c = g.querySelector('circle'); c.style.transformBox = 'fill-box'; c.style.transformOrigin = '50% 50%';
      c.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: T(340), delay: T(at), easing: 'cubic-bezier(.3,1.6,.5,1)', fill: 'backwards' });
      rotsDepois(id, at + 150);
    } else if (o.t === 'arco') {
      dash(g.querySelector('path'), 600, at);
      const pt = g.querySelector('.g-ponta'); if (pt) pt.animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(120), delay: T(at + 540), fill: 'backwards' });
      rotsDepois(id, at + 450);
    } else {
      aparecer(g, 400, at);
      rotsDepois(id, at + 100);
    }
  }
  function animar() {
    for (const a of anims) {
      const g = G[a.id]; if (!g) continue;
      const o = objs[a.id];
      if (a.k === 'mostra') animMostra(a.id, a.at);
      else if (a.k === 'desenha') {
        const p = g.querySelector('path'); dash(p, a.dur || 1100, a.at, 'linear');
        p.animate([{ fillOpacity: 0 }, { fillOpacity: 0, offset: 0.85 }, { fillOpacity: 1 }], { duration: T((a.dur || 1100) + 250), delay: T(a.at), fill: 'backwards' });
        rotsDepois(a.id, a.at + (a.dur || 1100));
      } else if (a.k === 'desliza') {
        const dur = a.dur || 1300;
        g.animate([{ transform: 'translate(' + (-a.d[0] * u) + 'px,' + (a.d[1] * u) + 'px)' }, { transform: 'translate(0px,0px)' }],
          { duration: T(dur), delay: T(a.at), easing: 'cubic-bezier(.45,0,.25,1)', fill: 'backwards' });
        rotsDepois(a.id, a.at + dur - 150);
      } else if (a.k === 'roda') {
        const dur = a.dur || 1600, c = P(a.c);
        g.style.transformBox = 'view-box'; g.style.transformOrigin = X(c[0]) + 'px ' + Y(c[1]) + 'px';
        g.animate([{ transform: 'rotate(' + a.ang + 'deg)' }, { transform: 'rotate(0deg)' }],
          { duration: T(dur), delay: T(a.at), easing: 'cubic-bezier(.45,0,.25,1)', fill: 'backwards' });
        rotsDepois(a.id, a.at + dur - 150);
      } else if (a.k === 'reflete') {
        const dur = a.dur || 1500, p = P(a.eixo[0]), q = P(a.eixo[1]);
        const px = X(p[0]), py = Y(p[1]);
        const th = Math.atan2(Y(q[1]) - py, X(q[0]) - px) * 180 / Math.PI;
        const tr = (s) => 'translate(' + px + 'px,' + py + 'px) rotate(' + th + 'deg) scale(1,' + s + ') rotate(' + (-th) + 'deg) translate(' + (-px) + 'px,' + (-py) + 'px)';
        g.style.transformBox = 'view-box'; g.style.transformOrigin = '0 0';
        g.animate([{ transform: tr(-1) }, { transform: tr(1) }], { duration: T(dur), delay: T(a.at), easing: 'cubic-bezier(.45,0,.25,1)', fill: 'backwards' });
        rotsDepois(a.id, a.at + dur - 150);
      } else if (a.k === 'acende') {
        g.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: T(1100), delay: T(a.at), fill: 'backwards' });
        if (o.t === 'eixo' || o.t === 'lin' || o.t === 'aux') g.querySelectorAll('line, path').forEach((e) => { if (!o.tr) dash(e, 500, a.at); });
      }
    }
  }

  return {
    el, n: (def.passos || []).length, X, Y, u, W, H,
    ir(k, anim) {
      reset();
      for (let i = 0; i < k; i++) (def.passos[i] || []).forEach((o) => OPS[o[0]](o, anim && i === k - 1));
      desenhar();
      if (anim && k > 0) animar();
    },
  };
}

Geo.n = 0;

/* Desenho estático (sem passos), por exemplo para as opções de uma escolha múltipla */
function GeoFixa(def) { const f = Geo(Object.assign({}, def, { passos: [] })); f.ir(0, false); return f; }

A.Geo = Geo;
A.GeoFixa = GeoFixa;
})();
</script>
<script>/* =====================================================================
   Isometrias — 8.º ano · peças comuns a todos os temas (capa, aberturas, malhas, figuras)
   Texto igual ao da ficha. Da ficha (.tex) vêm, na construção (window.FICHA): os títulos dos temas,
   os números dos «Agora tu» (procurados pelo início do texto), as contas da malha, a escolha
   múltipla e a resposta aberta.
   ===================================================================== */
(function () {
'use strict';
const A = window.Apresentacao;
const F = window.FICHA || { temas: [], agora: [], contas: [], em: [], abertas: [] };
window.APRESENTACAO_TITULO = 'Isometrias · 8.º ano';
window.APRESENTACAO_AUTOR = 'Prof. Miguel Teibão';
const NOMES = ['Isometrias', 'Rotação (revisão)', 'Reflexão (revisão)', 'Vetores (revisão)', 'Adição de vetores',
  'Translação associada a um vetor', 'Composição de translações', 'Reflexão deslizante', 'Simetrias', 'Frisos',
  'Revisão: que isometria foi?', 'Resumo: o que conserva cada isometria'];
const T = (n) => F.temas[n - 1] || NOMES[n - 1];
const compacto = (s) => String(s).replace(/<[^>]+>/g, '').replace(/\$/g, '').replace(/\s+/g, '');

/* ---------- geometria: imagens calculadas (nunca copiadas à mão) ---------- */
const arred = (v) => Math.round(v * 1000) / 1000;
const trans = (pts, dx, dy) => pts.map((p) => [arred(p[0] + dx), arred(p[1] + dy)]);
function rodar(pts, c, ang) {
  const a = ang * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
  return pts.map((p) => [arred(c[0] + (p[0] - c[0]) * co - (p[1] - c[1]) * si), arred(c[1] + (p[0] - c[0]) * si + (p[1] - c[1]) * co)]);
}
function refletir(pts, p, q) {
  const dx = q[0] - p[0], dy = q[1] - p[1], l2 = dx * dx + dy * dy;
  return pts.map((r) => {
    const t = ((r[0] - p[0]) * dx + (r[1] - p[1]) * dy) / l2, fx = p[0] + t * dx, fy = p[1] + t * dy;
    return [arred(2 * fx - r[0]), arred(2 * fy - r[1])];
  });
}
/* pé da perpendicular de r sobre a reta pq */
function pe(r, p, q) {
  const dx = q[0] - p[0], dy = q[1] - p[1], t = ((r[0] - p[0]) * dx + (r[1] - p[1]) * dy) / (dx * dx + dy * dy);
  return [arred(p[0] + t * dx), arred(p[1] + t * dy)];
}
/* motivo em L da ficha (sem simetrias), canto inferior esquerdo em (x, y) */
const motivoL = (x, y) => [[x, y], [x + 3, y], [x + 3, y + 1], [x + 1, y + 1], [x + 1, y + 2], [x, y + 2]];

/* ---------- malha de paralelogramos [AEOK] (ficha): A B C D E / F G H I J / K L M N O ---------- */
const PTS_P = {};
'ABCDE'.split('').forEach((n, i) => { PTS_P[n] = [1.35 * i, 0]; });
'FGHIJ'.split('').forEach((n, i) => { PTS_P[n] = [1.35 * i + 0.55, 1]; });
'KLMNO'.split('').forEach((n, i) => { PTS_P[n] = [1.35 * i + 1.1, 2]; });
function objsMalhaP() {
  const o = {
    mp_f: { t: 'pol', pts: ['A', 'E', 'O', 'K'], est: 'malha' },
    mp_l: { t: 'lin', est: 'orig', multi: [['F', 'J'], ['B', 'L'], ['C', 'M'], ['D', 'N']] },
  };
  'ABCDEFGHIJKLMNO'.split('').forEach((n) => {
    const pos = 'ABCDE'.indexOf(n) >= 0 ? 'below' : 'KLMNO'.indexOf(n) >= 0 ? 'above' : n === 'F' ? 'left' : n === 'J' ? 'right' : 'above left';
    o['mp_' + n] = { t: 'pto', p: n, m: n, pos, r: 6, mcor: 'GHI'.indexOf(n) >= 0 ? 'fundo' : '', dist: 'GHI'.indexOf(n) >= 0 ? 3 : 8 };
  });
  return o;
}
/* ---------- malha de triângulos [ADJ] (exercícios): A B C D / E F G / H I / J ---------- */
const PTS_T = {};
'ABCD'.split('').forEach((n, i) => { PTS_T[n] = [i, 0]; });
'EFG'.split('').forEach((n, i) => { PTS_T[n] = [i + 0.5, 0.866]; });
'HI'.split('').forEach((n, i) => { PTS_T[n] = [i + 1, 1.732]; });
PTS_T.J = [1.5, 2.598];
function objsMalhaT() {
  const o = {
    mt_f: { t: 'pol', pts: ['A', 'D', 'J'], est: 'malhaT' },
    mt_l: { t: 'lin', est: 'malhaT', multi: [['E', 'G'], ['H', 'I'], ['B', 'I'], ['C', 'G'], ['B', 'E'], ['C', 'H']] },
  };
  'ABCDEFGHIJ'.split('').forEach((n) => {
    const pos = 'ABCD'.indexOf(n) >= 0 ? 'below' : n === 'J' ? 'above' : 'EH'.indexOf(n) >= 0 ? 'left' : 'GI'.indexOf(n) >= 0 ? 'right' : 'above';
    o['mt_' + n] = { t: 'pto', p: n, m: n, pos, r: 6, mcor: n === 'F' ? 'fundoT' : '', dist: n === 'F' ? 5 : 8 };
  });
  return o;
}

/* ---------- malha de losangos [ADPM] (resposta aberta): A B C D / E F G H / I J K L / M N O P ---------- */
const PTS_L = {};
['ABCD', 'EFGH', 'IJKL', 'MNOP'].forEach((linha, j) => linha.split('').forEach((n, i) => { PTS_L[n] = [i + 0.5 * j, Math.round(0.866 * j * 1000) / 1000]; }));
function objsMalhaL() {
  const o = {
    ml_f: { t: 'pol', pts: ['A', 'D', 'P', 'M'], est: 'malhaT' },
    ml_l: { t: 'lin', est: 'malhaT', multi: [['E', 'H'], ['I', 'L'], ['B', 'N'], ['C', 'O']] },
  };
  'ABCDEFGHIJKLMNOP'.split('').forEach((n) => {
    const pos = 'ABCD'.indexOf(n) >= 0 ? 'below' : 'MNOP'.indexOf(n) >= 0 ? 'above' : 'EI'.indexOf(n) >= 0 ? 'left' : 'HL'.indexOf(n) >= 0 ? 'right' : 'above left';
    o['ml_' + n] = { t: 'pto', p: n, m: n, pos, r: 6, mcor: 'FGJK'.indexOf(n) >= 0 ? 'fundoT' : '', dist: 'FGJK'.indexOf(n) >= 0 ? 3 : 8 };
  });
  return o;
}

const X = window.FICHA_AP = {
  A, F, D: A.D, T, NOMES, trans, rodar, refletir, pe, motivoL, PTS_P, PTS_T, PTS_L,
  base(n, o) { return Object.assign({ tema: n, temaNome: T(n), grupo: 'Tema ' + n + ' · ' + T(n) }, o); },
  /* número do «Agora tu» cujo texto começa (ou contém) este trecho — a numeração vem da ficha */
  atN(trecho) {
    const a = F.agora.find((q) => compacto(q.texto).indexOf(compacto(trecho)) >= 0);
    if (!a) { console.warn('Agora tu não encontrado na ficha: ' + trecho); return '?'; }
    return a.n;
  },
  agoraTu(trecho, enunciado, cls) {
    const n = X.atN(trecho);
    return '<p class="enun at' + (cls ? ' ' + cls : '') + '"><span class="at-n">Agora tu ' + n + '.</span>' + enunciado + '</p>';
  },
  ancoraAt(trecho) { return ['Agora tu ' + X.atN(trecho) + '.', 1]; },
  contasDoAt(trecho) { const n = X.atN(trecho); const b = F.contas.find((x) => x.agora === n); return b ? b.itens : []; },
  /* escolha múltipla: procura a questão pelo conteúdo (o número pode mudar se a ficha mudar) */
  emPor(expr, opcao) {
    return F.em.find((q) => compacto(q.texto).indexOf(compacto(expr)) >= 0 && (!opcao || q.ops.some((o) => compacto(o.v).indexOf(compacto(opcao)) >= 0)));
  },
  /* abertura de um tema: número grande, título e as partes */
  abertura(n, partes, cls) {
    A.D({
      id: 't' + n + '-abre', tipo: 'livre', tema: n, temaNome: T(n), grupo: 'Tema ' + n + ' · ' + T(n), curto: 'Abertura do tema', ancora: [T(n), 1],
      montar(r) {
        const k = partes.length, cols = k <= 4 ? k : (k % 3 === 0 ? 3 : (k === 5 ? 5 : 4));
        r.innerHTML = '<div class="abre' + (cls ? ' ' + cls : '') + '"><div class="abre-n entra">' + n + '</div><h1 class="entra">' + A.marcar(T(n)) + '</h1><ol style="grid-template-columns:repeat(' + cols + ',1fr)' + (cols >= 5 ? ';font-size:24px' : '') + '">' +
          partes.map((p) => '<li class="entra"><b>' + p[0] + '</b>' + A.marcar(p[1]) + '</li>').join('') + '</ol></div>';
      },
    });
  },
  /* quadrícula da ficha: \grelha{0}{0}{w}{h} */
  Q(w, h, u, objs, passos, extra) {
    return A.Geo(Object.assign({ grelha: [0, 0, w, h], u, objs, passos: passos || [] }, extra || {}));
  },
  /* referencial cartesiano em quadrícula: eixos com seta, x, y, O e os números (pequenos) */
  referencial(x0, y0, x1, y1, u, extra, passos, opc) {
    const o = {
      ex: { t: 'vet', de: [x0, 0], ate: [x1 + 0.6, 0], cor: 'tinta', fino: true, cab: 16, larg: 7 },
      ey: { t: 'vet', de: [0, y0], ate: [0, y1 + 0.6], cor: 'tinta', fino: true, cab: 16, larg: 7 },
      lx: { t: 'rot', p: [x1 + 0.6, 0], m: 'x', pos: 'below', tam: 26 }, ly: { t: 'rot', p: [0, y1 + 0.6], m: 'y', pos: 'left', tam: 26 },
      lO: { t: 'rot', p: [0, 0], m: 'O', pos: 'below left', tam: 24, dist: 4 },
    };
    for (let k = Math.ceil(x0); k <= x1; k++) if (k) o['nx' + k] = { t: 'rot', p: [k, 0], m: String(k), pos: 'below', tam: 20, dist: 3, cor: 'cinza' };
    for (let k = Math.ceil(y0); k <= y1; k++) if (k) o['ny' + k] = { t: 'rot', p: [0, k], m: String(k), pos: 'left', tam: 20, dist: 4, cor: 'cinza' };
    return A.Geo(Object.assign({ grelha: [x0, y0, x1, y1], vista: [x0, y0, x1 + 0.6, y1 + 0.6], u, objs: Object.assign(o, extra || {}), passos: passos || [], pad: 30 }, opc || {}));
  },
  malhaP(u, extra, passos, opc) {
    return A.Geo(Object.assign({ vista: [0, 0, 6.5, 2], u, pts: PTS_P, objs: Object.assign(objsMalhaP(), extra || {}), passos: passos || [], tam: 30, pad: 44 }, opc || {}));
  },
  malhaL(u, extra, passos, opc) {
    return A.Geo(Object.assign({ vista: [0, 0, 4.5, 2.598], u, pts: PTS_L, objs: Object.assign(objsMalhaL(), extra || {}), passos: passos || [], tam: 30, pad: 44 }, opc || {}));
  },
  malhaT(u, extra, passos, opc) {
    return A.Geo(Object.assign({ vista: [0, 0, 3, 2.598], u, pts: PTS_T, objs: Object.assign(objsMalhaT(), extra || {}), passos: passos || [], tam: 30, pad: 44 }, opc || {}));
  },
  /* [vetores] O caminho na quadrícula: |dx| quadrículas para o lado e |dy| para cima ou para baixo, desenhado
     antes do vetor (é assim que se conta). Devolve { objs, passos(at), dur }: os objetos juntam-se aos da figura. */
  caminho(nome, de, dx, dy) {
    const objs = {}, meio = [de[0] + dx, de[1]];
    if (dx) {
      objs[nome + 'h'] = { t: 'lin', pts: [de, meio], est: 'cam', oculto: true };
      objs[nome + 'hn'] = { t: 'rot', p: [de[0] + dx / 2, de[1]], m: '§' + Math.abs(dx) + (dx > 0 ? ' →' : ' ←'), pos: dy > 0 ? 'below' : 'above', tam: 24, cor: 'cinza', oculto: true };
    }
    if (dy) {
      objs[nome + 'v'] = { t: 'lin', pts: [meio, [meio[0], meio[1] + dy]], est: 'cam', oculto: true };
      objs[nome + 'vn'] = { t: 'rot', p: [meio[0], meio[1] + dy / 2], m: '§' + Math.abs(dy) + (dy > 0 ? ' ↑' : ' ↓'), pos: dx > 0 ? 'right' : 'left', tam: 24, cor: 'cinza', oculto: true };
    }
    const dur = (dx ? 650 : 0) + (dy ? 650 : 0);
    const passos = (at) => {
      const p = []; let t = at || 0;
      if (dx) { p.push(['mostra', nome + 'h', t], ['mostra', nome + 'hn', t + 350]); t += 650; }
      if (dy) { p.push(['mostra', nome + 'v', t], ['mostra', nome + 'vn', t + 350]); }
      return p;
    };
    return { objs, passos, dur };
  },
  /* [vetores] Contas na malha [AEOK] (lidas da ficha), uma alínea por clique: os dois termos; o 2.º desliza para
     começar onde o 1.º acaba (é a troca que se escreve na conta); o resultado a vermelho (vetor, ponto ou vetor nulo).
     Devolve { objs, passos, planos } para X.malhaP e para o x.pratica (op.planos). */
  contasMalha(itens) {
    const pts = PTS_P, objs = {}, passos = [], planos = [];
    const V = (s) => { const m = /^~\{(\w)(\w)\}$/.exec(s.trim()); return m ? [m[1], m[2]] : null; };
    const dif = (a, b) => [arred(pts[b][0] - pts[a][0]), arred(pts[b][1] - pts[a][1])];
    const vet = (de, ate, cor) => ({ t: 'vet', de, ate, cor, oculto: true, cab: 18, larg: 7 });
    const pto = (p, cor) => ({ t: 'pto', p, cor, r: 11, oculto: true });
    let ant = [];
    itens.forEach((it, j) => {
      const [t1, t2] = it.e.split('+').map((s) => s.trim());
      const membros = it.sol.split('=').map((s) => s.trim());
      const cadeia = membros.length > 1 ? membros[0].split('+').map((s) => s.trim()) : null;
      const res = membros[membros.length - 1];
      const a = 'ca' + j, b = 'cb' + j, cc = 'cc' + j, r = 'cr' + j, ids = [a, b, r];
      const v1 = V(t1), v2 = V(t2);
      objs[a] = v1 ? vet(v1[0], v1[1], 'azul') : pto(t1, 'azul');
      objs[b] = vet(v2[0], v2[1], 'verde');
      passos.push([['esconde', ant], ['mostra', a], ['mostra', b, 600]]);
      const plano = [['fig']];
      if (cadeia && V(cadeia[1])) {
        const w = V(cadeia[1]);
        objs[cc] = vet(w[0], w[1], 'verde'); ids.push(cc);
        passos.push([['desliza', cc, dif(v2[0], w[0]), 0, 1100]]);
        plano.push(['seg', 'fig']);
      }
      const vr = V(res);
      objs[r] = vr ? vet(vr[0], vr[1], 'verm') : pto(/^~0$/.test(res) ? (v1 ? v1[0] : t1) : res, 'verm');
      passos.push([['mostra', r]]);
      plano.push(['seg', 'fig']);
      planos.push(plano);
      ant = ids;
    });
    return { objs, passos, planos };
  },
  /* [vetores] Composições na malha: T_(v)∘T_(u)(P) — primeiro u leva P ao ponto do meio, depois v leva-o ao fim. */
  contasComposta(itens) {
    const pts = PTS_P, objs = {}, passos = [], planos = [];
    const dif = (a, b) => [arred(pts[b][0] - pts[a][0]), arred(pts[b][1] - pts[a][1])];
    const vet = (de, ate, cor, extra) => Object.assign({ t: 'vet', de, ate, cor, oculto: true, cab: 20, larg: 8 }, extra || {});
    let ant = [];
    itens.forEach((it, j) => {
      const e = /T_\(~\{(\w)(\w)\}\)∘T_\(~\{(\w)(\w)\}\)\((\w)\)/.exec(it.e);
      const s = /T_\(~\{\w\w\}\)\((\w)\)\s*=\s*(\w)/.exec(it.sol);
      if (!e || !s) { console.warn('conta da composição por ler: ' + it.e); planos.push(null); return; }
      const [, v2a, v2b, v1a, v1b, P] = e, [, meio, fim] = s;
      const u = 'ku' + j, s1 = 'ks' + j, m1 = 'km' + j, w = 'kw' + j, s2 = 'kt' + j, m2 = 'kn' + j;
      objs[u] = vet(v1a, v1b, 'azul'); objs[w] = vet(v2a, v2b, 'laranja');
      objs[s1] = vet(P, meio, 'cinza', { tr: true, fino: true, cab: 16, larg: 7 }); objs[s2] = vet(meio, fim, 'cinza', { tr: true, fino: true, cab: 16, larg: 7 });
      objs[m1] = { t: 'pto', p: meio, cor: 'laranja', r: 11, oculto: true }; objs[m2] = { t: 'pto', p: fim, cor: 'verm', r: 11, oculto: true };
      objs['kp' + j] = { t: 'pto', p: P, cor: 'azul', r: 11, oculto: true };
      passos.push([['esconde', ant], ['mostra', 'kp' + j], ['mostra', u, 300], ['mostra', s1, 1000], ['desliza', m1, dif(P, meio), 1000, 800]]);
      passos.push([['mostra', w], ['mostra', s2, 700], ['desliza', m2, dif(meio, fim), 700, 800]]);
      planos.push([['fig'], ['seg', 'fig'], ['seg']]);
      ant = [u, s1, m1, w, s2, m2, 'kp' + j];
    });
    return { objs, passos, planos };
  },
  /* espaços das tabelas: ?{…} quadrado a preencher (resposta a vermelho); !{…} já feito */
  cx(v, atraso) {
    if (!atraso) return '$?{' + v + '}$';
    return '<span class="m"><span class="cx" data-cue="" data-atraso="' + atraso + '"><span class="r">' + A._int.html(A._int.analisar(v)) + '</span></span></span>';
  },
  cxp(v) { return '$!{' + v + '}$'; },
  /* linha a preencher, com atraso (ms) dentro do mesmo clique */
  lac(t, atraso) { return '<span class="lac" data-cue=""' + (atraso ? ' data-atraso="' + atraso + '"' : '') + '><span class="r">' + A.marcar(t) + '</span></span>'; },
  cxt(t, cls) { return '<span class="cx' + (cls ? ' ' + cls : '') + '" data-cue=""><span class="r">' + t + '</span></span>'; },
  cxtp(t, cls) { return '<span class="cx cheio' + (cls ? ' ' + cls : '') + '"><span class="r">' + t + '</span></span>'; },
  /* caixa «Para que serve?» e «Atenção!» */
  serve(t) { return '<p class="serve"><b class="t-serve">Para que serve?</b> ' + t + '</p>'; },
  atencao(t, cue) { return '<p class="atencao"' + (cue ? ' data-cue' : '') + '><b class="t-at">Atenção!</b> ' + t + '</p>'; },
};

   Isometrias — 8.º ano · Tema 8: Reflexão deslizante
   Regra do Miguel: PRIMEIRO as retas a tracejado perpendiculares ao eixo, de cada vértice até ao
   vértice da figura refletida (a tracejado), com o ângulo reto marcado; SÓ DEPOIS o vetor leva a
   figura refletida à imagem final.
   ===================================================================== */
(function () {
'use strict';
const X = window.FICHA_AP, A = X.A, D = X.D, L = X.motivoL;
const B8 = (o) => X.base(8, o);
const lbl = (nomes, pos) => nomes.map((n, k) => [n, pos[k]]);

/* Reflexão deslizante de um polígono: objetos e passos (perpendiculares + ângulos retos → figura refletida → vetor) */
function deslizante(id, pts, eixo, d, op) {
  op = op || {};
  const [p, q] = eixo, refl = X.refletir(pts, p, q), fim = X.trans(refl, d[0], d[1]);
  const objs = {}, perp = [], retos = [], vets = [];
  /* uma reta por vértice; se duas vão pela mesma reta, fica a mais comprida */
  const linhas = [];
  pts.forEach((v, k) => {
    const pe = X.pe(v, p, q), r = refl[k];
    const dup = linhas.find((l) => Math.abs((l.pe[0] - pe[0])) < 1e-6 && Math.abs(l.pe[1] - pe[1]) < 1e-6);
    const comp = Math.hypot(r[0] - v[0], r[1] - v[1]);
    if (dup) { if (comp > dup.comp) Object.assign(dup, { v, r, comp }); } else linhas.push({ v, r, pe, comp });
  });
  const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
  linhas.forEach((ln, k) => {
    objs[id + '_p' + k] = { t: 'aux', de: ln.v, ate: ln.r, oculto: true };
    objs[id + '_r' + k] = { t: 'reto', p: ln.pe, a: ln.v, b: [ln.pe[0] + ux, ln.pe[1] + uy], oculto: true };
    perp.push(id + '_p' + k); retos.push(id + '_r' + k);
  });
  objs[id + '_m'] = { t: 'pol', pts: refl, est: 'inter', oculto: true, lab: op.labM, nome: op.nomeM };
  (op.vetores || [0]).forEach((k, j) => {
    objs[id + '_v' + j] = { t: 'vet', de: refl[k], ate: fim[k], cor: 'verde', tr: true, fino: true, oculto: true };
    vets.push(id + '_v' + j);
  });
  objs[id + '_i'] = { t: 'pol', pts: fim, est: 'imag', oculto: true, lab: op.labI, nome: op.nomeI };
  const passo1 = [['mostra', perp, 0, 260], ['mostra', retos, 300 + perp.length * 260, 120]];
  const passo2 = [['reflete', id + '_m', eixo, 0, 1500]];
  const passo3 = [['mostra', vets, 0, 250], ['desliza', id + '_i', d, 500 + vets.length * 250, 1300]];
  const t1 = 700 + perp.length * 380, t2 = t1 + 1700;
  const junto = passo1.concat(passo2.map((o) => [o[0], o[1], o[2], t1, o[4]]),
    [['mostra', vets, t2, 250], ['desliza', id + '_i', d, t2 + 500 + vets.length * 250, 1300]]);
  return { objs, passos: [passo1, passo2, passo3], junto, refl, fim };
}
X.deslizante = deslizante;

function pentagono(q, de, ang, amLbl) {
  const vt = (q.geo && q.geo.vertices) || { A: 234, B: 306, C: 18, D: 90, E: 162 };
  const R = 2.2, objs = {
    c: { t: 'circ', c: [0, 0], r: R, est: 'contorno', tr: true },
    p: { t: 'pol', pts: ['A', 'B', 'C', 'D', 'E'].map((n) => polar(R, vt[n])) },
  };
  ['A', 'B', 'C', 'D', 'E'].forEach((n) => {
    objs['r' + n] = { t: 'lin', pts: [[0, 0], polar(R, vt[n])], est: 'fina' };
    objs['l' + n] = { t: 'rot', p: polar(R + 0.42, vt[n]), m: n, tam: 32 };
  });
  objs.o = { t: 'pto', p: [0, 0], r: 6 }; objs.ol = { t: 'rot', p: [0, -0.42], m: 'O', tam: 30, cor: 'tinta' };
  const a0 = vt[de], a1 = a0 + ang;
  objs.arc = { t: 'arco', c: [0, 0], r: 1.1, a0, a1, m: (ang > 0 ? '' : '−') + Math.abs(ang) + '°', rm: 0.72, am: amLbl, oculto: true, tam: 26 };
  objs.m = { t: 'pto', p: polar(R, a1), cor: 'verm', r: 12, oculto: true };
  return A.Geo({ vista: [-2.9, -2.9, 2.9, 2.9], u: 82, pad: 10, objs, passos: [[['mostra', 'arc'], ['roda', 'm', [0, 0], ang, 0, 1800]]] });
}
function relogio() {
  const objs = { c: { t: 'circ', c: [0, 0], r: 2.3, est: 'contorno' } };
  for (let h = 0; h < 12; h++) objs['t' + h] = { t: 'lin', pts: [polar(2.05, 90 - 30 * h), polar(2.3, 90 - 30 * h)], est: h % 3 ? 'orig' : 'grosso' };
  [[12, 90], [3, 0], [6, 270], [9, 180]].forEach(([n, a]) => { objs['n' + n] = { t: 'rot', p: polar(1.6, a), m: String(n), tam: 32 }; });
  objs.h = { t: 'lin', pts: [[0, 0], polar(1.1, 60)], est: 'grosso' };
  objs.m0 = { t: 'lin', pts: [[0, 0], [0, 1.9]], est: 'grosso' };
  objs.m1 = { t: 'lin', pts: [[0, 0], [1.9, 0]], est: 'grossoV', oculto: true };
  objs.arc = { t: 'arco', c: [0, 0], r: 0.95, a0: 90, a1: 0, m: '−90°', rm: 1.55, am: 40, oculto: true, tam: 26, cor: 'verm' };
  objs.o = { t: 'pto', p: [0, 0], r: 7 };
  return A.Geo({ vista: [-2.6, -2.6, 2.6, 2.6], u: 86, pad: 10, objs, passos: [[['roda', 'm1', [0, 0], -90, 0, 2000], ['mostra', 'arc', 0]]] });
}
function cataVento() {
  const P = [0, 90, 180, 270].map((a) => X.rodar([[0, 0], [2.2, 0], [2.2, 1.0]], [0, 0], a));
  return A.Geo({ vista: [-2.5, -2.5, 2.5, 2.5], u: 80, pad: 10, objs: {
    p: { t: 'pol', pts: P[0], multi: P }, c: { t: 'pol', pts: P[0], multi: P, est: 'inter', oculto: true }, k: { t: 'pto', p: [-1, 2.2], cor: 'verm', r: 10, oculto: true }, o: { t: 'pto', p: [0, 0], r: 6 },
  }, passos: [[['roda', 'c', [0, 0], 90, 0, 1700], ['roda', 'k', [0, 0], 90, 0, 1700]]] });
}
function hexagono() {
  const H = Array.from({ length: 6 }, (_, k) => polar(2, 60 * k)), objs = { p: { t: 'pol', pts: H } };
  const ids = [];
  for (let k = 0; k < 6; k++) { objs['e' + k] = { t: 'eixo', de: polar(2.45, 30 * k), ate: polar(2.45, 30 * k + 180), tr: true, fino: true, cor: 'verm', oculto: true }; ids.push('e' + k); }
  return A.Geo({ vista: [-2.6, -2.6, 2.6, 2.6], u: 82, pad: 10, objs, passos: [[['mostra', ids, 0, 300]]] });
}
function frisoPar() {
  const M = [[0, 0], [1.1, 0], [1.6, 0.9], [0.5, 0.9]], objs = {};
  for (let k = 0; k < 6; k++) objs['m' + k] = { t: 'pol', pts: X.trans(M, 2.2 * k, 0) };
  objs.a = { t: 'rot', p: [-0.6, 0.45], m: '…', tam: 40 }; objs.b = { t: 'rot', p: [13.3, 0.45], m: '…', tam: 40 };
  objs.o = { t: 'pto', p: [5.2, 0.45], cor: 'verm', r: 8, oculto: true };
  objs.c = { t: 'pol', pts: X.trans(M, 4.4, 0), est: 'inter', oculto: true };
  return A.Geo({ vista: [-1.2, -0.6, 13.9, 1.6], u: 62, pad: 8, objs, passos: [[['mostra', 'o'], ['roda', 'c', [5.2, 0.45], 180, 400, 1800]]] });
}

    x.html('<div class="duas meio"><div class="col" style="gap:16px;max-width:520px"><p class="enun at">' + num(this._n) + 'Constrói, na figura, a imagem do pentágono $[ABCDE]$ pela translação associada ao vetor $~w$.</p>' +
      '<div data-exercicio><div data-item class="dica" style="padding:6px 10px">O vetor $~w$ em cada vértice: 7 quadrículas para a direita e 1 para baixo.<i data-cue="f:f"></i></div></div>' +
      '</div><div data-fig="f"></div></div>', c, { f });
  },
}));

D(base('rotação de centro $O$ e amplitude $-90°$', {
  id: 'ra-rot', curto: 'Imagem do polígono pela rotação de −90°',
  montar(c, x) {
    const P = L(2, 6), O = [1, 5], R = X.rodar(P, O, -90);
    const f = X.Q(7, 9, 58, {
      p: { t: 'pol', pts: P }, o: { t: 'pto', p: O, m: 'O', pos: 'left' },
      a1: { t: 'aux', de: O, ate: [2, 6], oculto: true }, a2: { t: 'aux', de: O, ate: [2, 4], oculto: true },
      i: { t: 'pol', pts: R, est: 'imag', oculto: true },
      arc: { t: 'arco', c: O, r: 0.9, a0: 45, a1: -45, m: '−90°', rm: 1.55, am: 0, tam: 26, oculto: true },
    }, [[['mostra', 'a1'], ['roda', 'i', O, -90, 500, 1900], ['mostra', 'arc', 500], ['mostra', 'a2', 2300]]], { pad: 34 });
    x.html('<div class="duas meio"><div class="col" style="gap:16px;max-width:640px"><p class="enun at">' + num(this._n) + 'Constrói, na figura, a imagem do polígono pela rotação de centro $O$ e amplitude $-90°$ <span class="dica">(sentido dos ponteiros do relógio)</span>.</p>' +
      '<div data-exercicio><div data-item class="dica" style="padding:6px 10px">Cada vértice roda $90°$ no sentido dos ponteiros, à mesma distância de $O$.<i data-cue="f:f"></i></div></div>' +
      '</div><div data-fig="f"></div></div>', c, { f });
  },
}));

D(base('pela reflexão de eixo $r$', {
  id: 'ra-ref', curto: 'Imagem do quadrilátero pela reflexão de eixo r (diagonal)',
  montar(c, x) {
    const Q0 = [[1, 3], [3, 4], [2, 7], [1, 6]], Q1 = X.refletir(Q0, [0, 0], [8, 8]);
    const o = { p: { t: 'pol', pts: Q0, lab: lbl(['A', 'B', 'C', 'D'], ['left', 'right', 'above', 'left']) }, e: { t: 'eixo', de: [0, 0], ate: [8, 8], m: 'r', pos: 'below right' } };
    const ids = [], ret = [];
    Q0.forEach((q, k) => {
      o['a' + k] = { t: 'aux', de: q, ate: Q1[k], oculto: true }; ids.push('a' + k);
      const p = X.pe(q, [0, 0], [8, 8]); o['r' + k] = { t: 'reto', p, a: q, b: [p[0] + 1, p[1] + 1], s: 0.28, oculto: true }; ret.push('r' + k);
    });
    o.i = { t: 'pol', pts: Q1, est: 'imag', oculto: true, lab: lbl(["A'", "B'", "C'", "D'"], ['below', 'right', 'right', 'below']) };
    const f = X.Q(8, 8, 62, o, [[['mostra', ids, 0, 250], ['mostra', ret, 1100, 120], ['reflete', 'i', [[0, 0], [8, 8]], 1800, 1600]]], { pad: 34 });
    x.html('<div class="duas meio"><div class="col" style="gap:16px;max-width:620px"><p class="enun at">' + num(this._n) + 'Constrói, na figura, a imagem do quadrilátero $[ABCD]$ pela reflexão de eixo $r$.</p>' +
      '<div data-exercicio><div data-item class="dica" style="padding:6px 10px">Perpendiculares a $r$ por cada vértice, à mesma distância do outro lado: cada ponto $(x, y)$ vai para $(y, x)$.<i data-cue="f:f"></i></div></div>' +
      '</div><div data-fig="f"></div></div>', c, { f });
  },
}));

D(base('Completa cada figura', {
  id: 'ra-compl', curto: 'Completa cada figura (eixo de simetria e rotação de 180°)',
  montar(c, x) {
    const n = this._n, Lp = [[2, 2], [2, 5], [4, 7], [5, 6], [6, 6]];
    const f1 = X.Q(8, 8, 50, {
      l: { t: 'lin', pts: Lp, est: 'grosso' }, e: { t: 'eixo', de: [0, 0], ate: [8, 8], m: 'r', pos: 'below right' },
      i: { t: 'lin', pts: X.refletir(Lp, [0, 0], [8, 8]), est: 'grossoV', oculto: true },
    }, [[['reflete', 'i', [[0, 0], [8, 8]], 0, 1600]]], { pad: 30 });
    const M = L(5, 3), O = [4, 3];
    const f2 = X.Q(8, 6, 50, { p: { t: 'pol', pts: M }, o: { t: 'pto', p: O, m: 'O', pos: 'below' }, i: { t: 'pol', pts: X.rodar(M, O, 180), est: 'imag', oculto: true } },
      [[['roda', 'i', O, 180, 0, 1800]]], { pad: 30 });
    x.html('<p class="enun at">' + num(n) + 'Completa cada figura.</p>' +
      '<div class="alineas a2" data-exercicio style="margin-top:8px">' +
      '<div data-item class="fig-col"><div class="alinea-t"><b>' + n + '.1</b> A reta $r$ é eixo de simetria da figura.</div><div data-fig="f1"></div><i data-cue="f:f1"></i></div>' +
      '<div data-item class="fig-col"><div class="alinea-t"><b>' + n + '.2</b> A figura tem simetria de rotação de centro $O$ e amplitude $180°$.</div><div data-fig="f2"></div><i data-cue="f:f2"></i></div></div>', c, { f1, f2 });
  },
}));

D(base('Desenha o eixo da reflexão e um representante do vetor da translação', {
  id: 'ra-eixo', curto: 'Reflexão deslizante: descobrir o eixo e o vetor',
  montar(c, x) {
    const T0 = [[1, 5], [4, 6], [2, 7]], T2 = [[8, 3], [11, 2], [9, 1]];
    const g = X.deslizante('t', T0, [[0, 4], [14, 4]], [7, 0], { vetores: [0, 1] });
    const objs = Object.assign({
      t: { t: 'pol', pts: T0, lab: lbl(['A', 'B', 'C'], ['left', 'right', 'above']) },
      t2: { t: 'pol', pts: T2, lab: lbl(['P', 'Q', 'R'], ['above', 'right', 'below']) },
      m1: { t: 'pto', p: [4.5, 4], cor: 'verm', r: 7, oculto: true }, m2: { t: 'pto', p: [7.5, 4], cor: 'verm', r: 7, oculto: true }, m3: { t: 'pto', p: [5.5, 4], cor: 'verm', r: 7, oculto: true },
      s1: { t: 'lin', pts: [T0[0], T2[0]], est: 'fina', oculto: true }, s2: { t: 'lin', pts: [T0[1], T2[1]], est: 'fina', oculto: true }, s3: { t: 'lin', pts: [T0[2], T2[2]], est: 'fina', oculto: true },
      e: { t: 'eixo', de: [0, 4], ate: [14, 4], cor: 'verm', m: 'r', pos: 'above left', oculto: true },
      uu: { t: 'vet', de: [2, 1], ate: [9, 1], cor: 'verde', m: '~u', pos: 'below', oculto: true },
    }, g.objs);
    delete objs.t_i;
    const f = X.Q(14, 8, 62, objs, [
      [['mostra', ['s1', 's2', 's3'], 0, 300], ['mostra', ['m1', 'm2', 'm3'], 1100, 250], ['mostra', 'e', 2100]],
      [['mostra', g.passos[0][0][1], 0, 260], ['mostra', g.passos[0][1][1], 900, 120], ['reflete', 't_m', [[0, 4], [14, 4]], 1700, 1400],
        ['mostra', ['t_v0', 't_v1'], 3400, 250], ['mostra', 'uu', 4000]],
    ], { pad: 34 });
    x.html('<p class="enun at">' + num(this._n) + 'O triângulo $[PQR]$ é a imagem do triângulo $[ABC]$ por uma reflexão deslizante. Desenha o eixo da reflexão e um representante do vetor da translação.</p>' +
      '<div class="duas meio" style="margin-top:6px"><div class="col itens-at" data-exercicio style="max-width:520px">' +
      '<div data-item>Eixo: a reta horizontal a meio das duas figuras (passa pelos pontos médios de $[AP]$, $[BQ]$ e $[CR]$).<i data-cue="f:f"></i></div>' +
      '<div data-item>Vetor: refletido $[ABC]$, faltam 7 quadrículas para a direita.<i data-cue="f:f"></i></div></div>' +
      '<div data-fig="f"></div></div>', c, { f });
  },
}));

D(base('pela reflexão deslizante de eixo $s$ e vetor', {
  id: 'ra-desl', curto: 'Reflexão deslizante de eixo s e vetor u (construir)',
  montar(c, x) {
    const T0 = [[1, 1], [3, 2], [2, 4]];
    const g = X.deslizante('t', T0, [[5, 0], [5, 8]], [0, 3], { vetores: [0, 1, 2] });
    const f = X.Q(10, 8, 62, Object.assign({
      e: { t: 'eixo', de: [5, 0], ate: [5, 8], m: 's', pos: 'below right' },
      u: { t: 'vet', de: [1, 5], ate: [1, 8], cor: 'verde', m: '~u', pos: 'left' },
      t: { t: 'pol', pts: T0, lab: lbl(['A', 'B', 'C'], ['below', 'right', 'above']) },
    }, g.objs), [g.junto], { pad: 34 });
    x.html('<div class="duas meio"><div class="col" style="gap:16px;max-width:600px"><p class="enun at">' + num(this._n) + 'Constrói, na figura, a imagem do triângulo $[ABC]$ pela reflexão deslizante de eixo $s$ e vetor $~u$.</p>' +
      '<div data-exercicio><div data-item class="dica" style="padding:6px 10px">Perpendiculares a $s$ e ângulos retos → triângulo refletido (a tracejado) → 3 quadrículas para cima.<i data-cue="f:f"></i></div></div>' +
      '</div><div data-fig="f"></div></div>', c, { f });
  },
}));
})();
</script>
